<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOP PAY</title>

<link rel="icon" type="image/webp" href="https://i.ibb.co/fVqwvyvF/aa.webp">
<link rel="apple-touch-icon" href="https://i.ibb.co/fVqwvyvF/aa.webp">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#f5f5f5;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
    color:#111;
}

.page{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:8px 16px 15px;
}

/* HEADER */

.header{
    width:100%;
    text-align:center;
}

.logo{
    width:160px;
    height:64px;
    object-fit:contain;
    display:block;
    margin:0 auto 8px;
}

.logo-name{
    margin-top:0;
    color:#2866c8;
    font-size:23px;
    line-height:27px;
    font-weight:700;
    letter-spacing:-.4px;
}

.subtitle{
    margin-top:1px;
    color:#777;
    font-size:12px;
    line-height:15px;
    font-weight:400;
}

/* STEPS */

.steps{
    width:48%;
    margin:13px auto 39px;
    display:flex;
    align-items:flex-start;
}

.step{
    min-width:31px;
    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        sans-serif;
}

.circle{
    width:30px;
    height:30px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:500;

    -webkit-font-smoothing:antialiased;
}

.active .circle{
    background:#2c68d0;
    color:#fff;
}

.inactive .circle{
    background:#d9d9d9;
    color:#fff;
}

.step-name{
    margin-top:4px;
    font-size:12.5px;
    line-height:14px;
    white-space:nowrap;
    font-weight:400;
}

.active .step-name{
    color:#2c68d0;
}

.inactive .step-name{
    color:#a0a0a0;
}

.step-line{
    flex:1;
    height:2.5px;
    border-radius:5px;
    background:#2c68d0;
    margin:12px 3px 0;
}

/* POSTER */

.poster{
    width:100%;
    height:158px;
    position:relative;

    /* NO TOP / BOTTOM GAP */
    margin-top:0;
    margin-bottom:0;

    overflow:hidden;
    border-radius:17px;
    background:#111;
}

.slides-track{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:100%;

    display:flex;

    transition:
        transform .6s cubic-bezier(.25,.8,.25,1);

    will-change:transform;
}

.slide{
    position:relative;

    flex:0 0 100%;
    width:100%;
    height:100%;

    overflow:hidden;
}

.slide img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;

    user-select:none;
    -webkit-user-drag:none;
}

/* DOTS */

.dots{
    position:absolute;
    left:0;
    right:0;
    bottom:8px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:5px;

    z-index:5;
}

.dot{
    width:5px;
    height:5px;
    border-radius:10px;
    background:rgba(255,255,255,.55);

    transition:
        width .25s ease,
        background .25s ease;
}

.dot.active{
    width:14px;
    background:#fff;
}

/* CARD */

.card{
    background:#fff;

    border-radius:0 0 17px 17px;

    padding:28px 21px 22px;
}

.card-title{
    margin:0;

    text-align:center;

    font-size:30px;
    line-height:35px;
    font-weight:700;

    letter-spacing:-.4px;
    white-space:nowrap;
}

.description{
    margin:13px 0 27px;

    text-align:center;

    color:#777;

    font-size:12px;
    line-height:15px;
    font-weight:400;
}

/* INPUTS */

.input-box{
    width:100%;
    height:49px;

    border:1.2px solid #e4e4e4;
    border-radius:15px;

    display:flex;
    align-items:center;

    background:#fff;
}

.input-box:focus-within{
    border-color:#c7d4ea;
}

.input-icon{
    width:36px;
    min-width:36px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.input-icon svg{
    width:18px;
    height:18px;
    fill:#080808;
}

.input-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;
    background:transparent;

    padding:0 8px 0 0;

    color:#111;

    font-size:15px;
    font-weight:400;
}

.input-box input::placeholder{
    color:#8f8f8f;
    opacity:1;

    font-size:15px;
}

/* FORGOT */

.forgot{
    margin-top:10px;
    text-align:right;
}

.forgot button{
    background:none;
    border:0;
    padding:0;

    color:#2d66c5;

    font-size:14px;
    line-height:17px;
    font-weight:400;
}

/* CONTINUE */

.continue{
    width:100%;
    height:54px;

    margin-top:19px;

    border:0;
    border-radius:14px;

    background:#bec9f3;
    color:#fff;

    font-size:15px;
    font-weight:500;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;

    cursor:pointer;
}

.continue.enabled{
    background:#2e67c9;
}

.continue:disabled{
    cursor:default;
}

.arrow{
    font-size:18px;
    font-weight:300;
}

/* REGISTER */

.register{
    width:100%;
    height:51px;

    margin-top:15px;

    border:0;
    border-radius:14px;

    background:#20c55a;
    color:#fff;

    font-size:15px;
    font-weight:500;

    cursor:pointer;
}

/* SECURITY */

.security{
    margin-top:17px;

    text-align:center;

    color:#888;

    font-size:11px;
    line-height:15px;
}

.security strong{
    color:#555;
    font-weight:500;
}

/* TELEGRAM */

.telegram{
    position:fixed;

    right:18px;
    bottom:18px;

    width:48px;
    height:48px;

    border-radius:50%;

    background:#229ed9;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 5px 18px rgba(0,0,0,.18);

    z-index:100;
}

.telegram svg{
    width:23px;
    height:23px;
    fill:#fff;
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:82px;

    transform:
        translateX(-50%)
        translateY(15px);

    background:#222;
    color:#fff;

    padding:10px 15px;

    border-radius:10px;

    font-size:12px;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .25s ease,
        transform .25s ease;

    z-index:200;

    white-space:nowrap;
}

.toast.show{
    opacity:1;
    visibility:visible;

    transform:
        translateX(-50%)
        translateY(0);
}

/* MOBILE */

@media (max-width:380px){

    .steps{
        width:52%;
    }

    .poster{
        height:auto;
        aspect-ratio:655 / 261;

        /* NO GAP */
        margin-top:0;
        margin-bottom:0;
    }
}

@media (max-width:350px){

    .steps{
        width:48%;
    }

    .card-title{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="header">

        <img
            class="logo"
            src="https://i.ibb.co/fVqwvyvF/aa.webp"
            alt="TOP PAY"
        >

        <div class="logo-name">
            TOP PAY
        </div>

        <div class="subtitle">
            Secure Payment Gateway
        </div>

    </div>


    <!-- STEPS -->

    <div class="steps">

        <div class="step active">

            <div class="circle">
                1
            </div>

            <div class="step-name">
                Account
            </div>

        </div>


        <div class="step-line"></div>


        <div class="step inactive">

            <div class="circle">
                2
            </div>

            <div class="step-name">
                MPIN
            </div>

        </div>

    </div>


    <!-- POSTER -->

    <div class="poster">

        <div
            class="slides-track"
            id="slidesTrack">
        </div>

        <div
            class="dots"
            id="dots">
        </div>

    </div>


    <!-- CARD -->

    <div class="card">

        <h1 class="card-title">
            Enter Your Credentials
        </h1>

        <p class="description">
            Enter your registered mobile number and password
            to continue securely.
        </p>


        <!-- MOBILE -->

        <div class="input-box">

            <div class="input-icon">

                <svg
                    viewBox="0 0 24 24">

                    <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"/>

                </svg>

            </div>

            <input
                id="mobile"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="Mobile Number"
                autocomplete="tel"
            >

        </div>


        <!-- PASSWORD -->

        <div
            class="input-box"
            style="margin-top:12px;">

            <div class="input-icon">

                <svg
                    viewBox="0 0 24 24">

                    <path d="M17 8h-1V6a4 4 0 00-8 0v2H7a2 2 0 00-2 2v8a2 2 0 002 2h10a2 2 0 002-2v-8a2 2 0 00-2-2zm-7-2a2 2 0 014 0v2h-4V6zm5 9h-2v2h-2v-2H9v-2h2v-2h2v2h2v2z"/>

                </svg>

            </div>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

        </div>


        <!-- FORGOT -->

        <div class="forgot">

            <button
                type="button"
                id="forgotBtn">
                Forgot Password?
            </button>

        </div>


        <!-- CONTINUE -->

        <button
            class="continue"
            id="continueBtn"
            type="button"
            disabled>

            <span>
                Continue to MPIN
            </span>

            <span class="arrow">
                →
            </span>

        </button>


        <!-- REGISTER -->

        <button
            class="register"
            id="registerBtn"
            type="button">

            Register New Account

        </button>


        <!-- SECURITY -->

        <div class="security">

            🔒 Your information is securely encrypted.
            <br>

            <strong>
                Never share your password or MPIN with anyone.
            </strong>

        </div>

    </div>

</div>


<!-- TELEGRAM -->

<div
    class="telegram"
    id="telegramBtn">

    <svg
        viewBox="0 0 24 24">

        <path d="M21.4 3.6L18.2 20c-.24 1.16-.87 1.45-1.76.9l-4.85-3.58-2.34 2.25c-.26.26-.48.48-.98.48l.35-4.94 8.99-8.12c.39-.35-.08-.55-.6-.2L6.9 13.95 2.15 12.47c-1.03-.32-1.05-1.03.21-1.52L20.9 3.72c.86-.32 1.61.2 1.5-.12z"/>

    </svg>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* POSTERS */

const POSTER_1 =
    "https://i.ibb.co/hRMF9Dwp/IMG-1764.jpg";

const POSTER_2 =
    "https://i.ibb.co/hJPmhB2X/IMG-1763.jpg";


const posters = [
    POSTER_1,
    POSTER_2,
    POSTER_1,
    POSTER_2
];


let currentSlide = 0;
let sliderTimer;


/* ELEMENTS */

const track =
    document.getElementById("slidesTrack");

const dots =
    document.getElementById("dots");


/* CREATE SLIDES */

function createSlides(){

    track.innerHTML = "";
    dots.innerHTML = "";

    posters.forEach(
        (poster,index)=>{

            const slide =
                document.createElement("div");

            slide.className = "slide";


            const img =
                document.createElement("img");

            img.src = poster;
            img.alt = "TOP PAY";

            slide.appendChild(img);

            track.appendChild(slide);


            const dot =
                document.createElement("span");

            dot.className =
                "dot" +
                (index === 0 ? " active" : "");

            dot.addEventListener(
                "click",
                ()=>{
                    currentSlide = index;
                    updateSlider();
                    restartSlider();
                }
            );

            dots.appendChild(dot);

        }
    );

}


/* UPDATE SLIDER */

function updateSlider(){

    track.style.transform =
        "translate3d(-" +
        (currentSlide * 100) +
        "%,0,0)";


    document
        .querySelectorAll(".dot")
        .forEach(
            (dot,index)=>{

                dot.classList.toggle(
                    "active",
                    index === currentSlide
                );

            }
        );

}


/* AUTO SLIDER */

function startSlider(){

    sliderTimer =
        setInterval(
            ()=>{

                currentSlide++;

                if(
                    currentSlide >= posters.length
                ){
                    currentSlide = 0;
                }

                updateSlider();

            },
            3000
        );

}


function restartSlider(){

    clearInterval(sliderTimer);

    startSlider();

}


/* FORM */

const mobile =
    document.getElementById("mobile");

const password =
    document.getElementById("password");

const continueBtn =
    document.getElementById("continueBtn");


function validateForm(){

    const mobileValue =
        mobile.value.replace(/\D/g,"");

    mobile.value =
        mobileValue.slice(0,10);


    const valid =
        mobile.value.length === 10 &&
        password.value.trim().length > 0;


    continueBtn.disabled =
        !valid;


    continueBtn.classList.toggle(
        "enabled",
        valid
    );

}


mobile.addEventListener(
    "input",
    validateForm
);

password.addEventListener(
    "input",
    validateForm
);


/* TOAST */

const toast =
    document.getElementById("toast");


function showToast(message){

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(
        ()=>{
            toast.classList.remove("show");
        },
        2200
    );

}


/* CONTINUE */

continueBtn.addEventListener(
    "click",
    ()=>{

        if(
            continueBtn.disabled
        ){
            return;
        }

        showToast(
            "Account details accepted."
        );

    }
);


/* FORGOT */

document
    .getElementById("forgotBtn")
    .addEventListener(
        "click",
        ()=>{
            showToast(
                "Forgot password option selected."
            );
        }
    );


/* REGISTER */

document
    .getElementById("registerBtn")
    .addEventListener(
        "click",
        ()=>{
            showToast(
                "Registration option selected."
            );
        }
    );


/* TELEGRAM */

document
    .getElementById("telegramBtn")
    .addEventListener(
        "click",
        ()=>{
            showToast(
                "Telegram support selected."
            );
        }
    );


/* INIT */

createSlides();
updateSlider();
startSlider();

</script>

</body>
</html>
