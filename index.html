<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#24252c">

<link rel="icon"
      type="image/webp"
      href="https://i.ibb.co/fVqwvyvF/aa.webp">

<link rel="apple-touch-icon"
      href="https://i.ibb.co/fVqwvyvF/aa.webp">

<title>TOP PAY</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;

    background:#f4f7fe;
    color:#111;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    font-weight:400;
}

body{
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
}


/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:430px;
    min-height:100vh;
    margin:0 auto;
    padding:8px 16px 15px;
}


/* =========================
   HEADER
========================= */

.header{
    width:100%;
    text-align:center;
}


/* TOP LOGO
   2X SIZE
*/

.logo{
    width:210px;
    height:84px;

    object-fit:contain;

    display:block;

    margin:0 auto 8px;
}


/* PAGE NAME */

.logo-name{
    margin-top:0;

    color:#2866c8;

    font-size:23px;
    line-height:27px;

    font-weight:700;

    letter-spacing:-.4px;
}


/* SUBTITLE */

.subtitle{
    margin-top:1px;

    color:#777;

    font-size:12px;
    line-height:15px;

    font-weight:400;
}


/* =========================
   STEPS
========================= */

/*
   Narrower width = steps
   much closer together
*/

.steps{
    width:48%;

    margin:13px auto 39px;

    display:flex;
    align-items:flex-start;
}


/* iOS STYLE STEP */

.step{
    min-width:31px;

    display:flex;
    flex-direction:column;
    align-items:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        sans-serif;
}


/* CIRCLE */

.circle{
    width:30px;
    height:30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;

    font-weight:500;

    letter-spacing:0;

    -webkit-font-smoothing:antialiased;
}

.active .circle{
    background:#2c68d0;
    color:#fff;
}

.inactive .circle{
    background:#d9d9d9;
    color:#fff;
}


/* STEP NAME */

.step-name{
    margin-top:4px;

    font-size:12.5px;
    line-height:14px;

    white-space:nowrap;

    font-weight:400;

    letter-spacing:-.05px;

    -webkit-font-smoothing:antialiased;
}

.active .step-name{
    color:#2c68d0;
}

.inactive .step-name{
    color:#a0a0a0;
}


/* LINE */

.step-line{
    flex:1;

    height:2.5px;

    border-radius:5px;

    background:#2c68d0;

    margin:12px 3px 0;
}


/* =========================
   POSTER
========================= */

.poster{
    width:100%;
    height:158px;

    position:relative;

    overflow:hidden;

    border-radius:17px;

    background:#111;
}

.slides-track{
    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    display:flex;

    transition:
        transform .6s cubic-bezier(.25,.8,.25,1);

    will-change:transform;
}

.slide{
    position:relative;

    flex:0 0 100%;

    width:100%;
    height:100%;

    overflow:hidden;
}

.slide img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    user-select:none;

    -webkit-user-drag:none;
}


/* =========================
   DOTS
========================= */

.dots{
    position:absolute;

    left:0;
    right:0;
    bottom:8px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:5px;

    z-index:5;
}

.dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#fff;

    opacity:.9;

    transition:width .25s ease;
}

.dot.active{
    width:19px;

    border-radius:7px;
}


/* =========================
   CARD
========================= */

.card{
    background:#fff;

    border-radius:0 0 17px 17px;

    padding:28px 21px 22px;
}

.card-title{
    margin:0;

    text-align:center;

    font-size:30px;
    line-height:35px;

    font-weight:700;

    letter-spacing:-.4px;

    white-space:nowrap;
}

.description{
    margin:13px 0 27px;

    text-align:center;

    color:#777;

    font-size:12px;
    line-height:15px;

    font-weight:400;
}


/* =========================
   LABEL
========================= */

.label{
    display:block;

    margin-bottom:6px;

    color:#111;

    font-size:12px;
    line-height:15px;

    font-weight:400;
}

.password-label{
    margin-top:17px;
}


/* =========================
   INPUT
========================= */

.input-box{
    width:100%;
    height:49px;

    border:1.2px solid #e4e4e4;

    border-radius:15px;

    display:flex;
    align-items:center;

    background:#fff;
}

.input-box:focus-within{
    border-color:#c7d4ea;
}

.input-icon{
    width:36px;
    min-width:36px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.input-icon svg{
    width:18px;
    height:18px;

    fill:#080808;
}

.input-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    padding:0 8px 0 0;

    color:#111;

    font-size:15px;

    font-weight:400;
}

.input-box input::placeholder{
    color:#8f8f8f;

    opacity:1;

    font-size:15px;
}


/* =========================
   FORGOT
========================= */

.forgot{
    display:flex;

    justify-content:flex-end;

    margin-top:8px;
}

.forgot button{
    background:none;

    padding:0;

    color:#2d66c5;

    font-size:14px;

    line-height:17px;

    font-weight:400;
}


/* =========================
   CONTINUE
========================= */

.continue{
    width:100%;
    height:54px;

    margin-top:19px;

    border-radius:14px;

    background:#bec9f3;

    color:#fff;

    font-size:15px;

    font-weight:500;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;
}

.continue.enabled{
    background:#2e67c9;
}

.continue:disabled{
    cursor:default;
}

.arrow{
    font-size:18px;

    font-weight:300;
}


/* =========================
   REGISTER
========================= */

.register{
    width:100%;
    height:51px;

    margin-top:15px;

    border-radius:14px;

    background:#20c55a;

    color:#fff;

    font-size:15px;

    font-weight:500;
}


/* =========================
   SECURITY
========================= */

.security{
    width:100%;
    min-height:62px;

    margin-top:16px;

    padding:10px 12px;

    border-radius:13px;

    background:#eef5fc;

    display:flex;

    align-items:flex-start;

    gap:8px;

    overflow:hidden;
}

.security svg{
    width:16px;
    min-width:16px;
    height:16px;

    fill:#2869d1;

    margin-top:1px;
}

.security-text{
    margin:0;

    font-size:10.5px;

    line-height:14px;

    font-weight:400;
}


/* =========================
   TELEGRAM
========================= */

.telegram{
    position:fixed;

    right:13px;
    bottom:12px;

    width:41px;
    height:41px;

    border-radius:50%;

    background:#119bd1;

    display:flex;

    align-items:center;
    justify-content:center;

    box-shadow:
        0 3px 10px rgba(0,0,0,.16);

    z-index:20;
}

.telegram svg{
    width:22px;
    height:22px;

    fill:#fff;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:61px;

    transform:
        translate(-50%,10px);

    opacity:0;

    pointer-events:none;

    padding:7px 11px;

    border-radius:8px;

    background:
        rgba(20,20,20,.94);

    color:#fff;

    font-size:9px;

    z-index:100;

    transition:.2s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   SMALL DEVICES
========================= */

@media(max-width:380px){

    .page{
        padding-left:14px;
        padding-right:14px;
    }


    .logo{
        width:200px;
        height:80px;

        margin-bottom:8px;
    }


    .logo-name{
        font-size:22px;
        line-height:26px;
    }


    .subtitle{
        font-size:11.5px;
    }


    .steps{
        width:52%;
    }


    .poster{
        height:auto;

        aspect-ratio:655 / 261;
    }


    .card{
        padding-left:18px;
        padding-right:18px;
    }


    .card-title{
        font-size:26px;
        line-height:31px;
    }


    .description{
        font-size:11.5px;
    }


    .input-box{
        height:47px;
    }


    .input-box input{
        font-size:15px;
    }


    .input-box input::placeholder{
        font-size:15px;
    }


    .continue{
        height:52px;
        font-size:15px;
    }


    .register{
        height:49px;
        font-size:15px;
    }


    .security-text{
        font-size:10px;
    }

}


@media(max-width:350px){

    .logo{
        width:190px;
        height:76px;
    }


    .steps{
        width:48%;
    }


    .card-title{
        font-size:23px;
        line-height:28px;
    }


    .input-box input{
        font-size:14px;
    }


    .input-box input::placeholder{
        font-size:14px;
    }


    .continue{
        font-size:14px;
    }


    .register{
        font-size:14px;
    }

}

</style>

</head>


<body>

<div class="page">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">


        <!-- TOP LOGO -->

        <img
            class="logo"
            src="https://i.ibb.co/fVqwvyvF/aa.webp"
            alt="TOP PAY"
        >


        <!-- PAGE NAME -->

        <div class="logo-name">
            TOP PAY
        </div>


        <!-- SUBTITLE -->

        <div class="subtitle">
            Secure Payment Gateway
        </div>


    </div>


    <!-- =========================
         STEPS
    ========================== -->

    <div class="steps">


        <div class="step active">

            <div class="circle">
                1
            </div>

            <div class="step-name">
                Account
            </div>

        </div>


        <div class="step-line"></div>


        <div class="step inactive">

            <div class="circle">
                2
            </div>

            <div class="step-name">
                MPIN
            </div>

        </div>


    </div>


    <!-- =========================
         POSTER
    ========================== -->

    <div class="poster">


        <div
            class="slides-track"
            id="slidesTrack">
        </div>


        <div
            class="dots"
            id="dots">
        </div>


    </div>


    <!-- =========================
         CARD
    ========================== -->

    <div class="card">


        <h1 class="card-title">
            Enter Your Credentials
        </h1>


        <p class="description">

            Please provide your registered mobile number and<br>
            password

        </p>


        <form id="loginForm">


            <!-- MOBILE -->

            <label class="label">
                Mobile Number
            </label>


            <div class="input-box">


                <div class="input-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M6.62 10.79a15.46 15.46 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.72 21 3 13.28 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2Z"/>

                    </svg>

                </div>


                <input
                    id="mobile"
                    type="tel"
                    inputmode="numeric"
                    maxlength="10"
                    autocomplete="tel"
                    placeholder="Enter 10-digit mobile number"
                >


            </div>


            <!-- PASSWORD -->

            <label class="label password-label">
                Password
            </label>


            <div class="input-box">


                <div class="input-icon">

                    <svg viewBox="0 0 24 24">

                        <path d="M7 10V8a5 5 0 0 1 10 0v2h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 0 0-6 0v2Zm3 4a2 2 0 1 0 2 1.73V18h-2v-2.27A2 2 0 0 0 12 14Z"/>

                    </svg>

                </div>


                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter password"
                >


            </div>


            <!-- FORGOT -->

            <div class="forgot">

                <button
                    type="button"
                    id="forgot">

                    Forget Password

                </button>

            </div>


            <!-- CONTINUE -->

            <button
                type="submit"
                id="continueBtn"
                class="continue"
                disabled>

                <span>
                    Continue to MPIN
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <!-- REGISTER -->

            <button
                type="button"
                id="registerBtn"
                class="register">

                Register New Account

            </button>


        </form>


        <!-- SECURITY -->

        <div class="security">


            <svg viewBox="0 0 24 24">

                <path d="M12 2 20 5v6c0 5.25-3.43 9.86-8 11-4.57-1.14-8-5.75-8-11V5l8-3Zm0 3.08L8 6.58V11c0 3.85 2.37 7.28 4 8.3 1.63-1.02 4-4.45 4-8.3V6.58l-4-1.5Z"/>

            </svg>


            <p class="security-text">

                Your credentials are securely encrypted.
                MPIN adds extra security to authorize transactions.

            </p>


        </div>


    </div>


</div>


<!-- =========================
     TELEGRAM
========================= -->

<a
    href="#"
    class="telegram"
    id="telegram"
    aria-label="Telegram">

    <svg viewBox="0 0 24 24">

        <path d="M21.4 3.18 18.15 20c-.25 1.19-.91 1.49-1.84.93l-5.1-3.76-2.46 2.37c-.27.27-.5.5-1.02.5l.36-5.2 9.47-8.55c.41-.36-.09-.56-.64-.2L5.22 13.32.18 11.74c-1.1-.34-1.12-1.1.23-1.6L20.1 2.56c.92-.34 1.73.22 1.3.62Z"/>

    </svg>

</a>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================
   POSTERS
========================= */

const POSTER_1 =
    "https://i.ibb.co/hRMF9Dwp/IMG-1764.jpg";

const POSTER_2 =
    "https://i.ibb.co/hJPmhB2X/IMG-1763.jpg";


const posters = [

    POSTER_1,
    POSTER_2,
    POSTER_1,
    POSTER_2

];


let currentSlide = 0;

let sliderTimer;


/* =========================
   CREATE SLIDES
========================= */

function createSlides(){

    const track =
        document.getElementById(
            "slidesTrack"
        );


    const dots =
        document.getElementById(
            "dots"
        );


    track.innerHTML = "";

    dots.innerHTML = "";


    posters.forEach(
        (url,index)=>{


            const slide =
                document.createElement(
                    "div"
                );


            slide.className =
                "slide";


            const image =
                document.createElement(
                    "img"
                );


            image.src = url;

            image.alt = "TOP PAY";


            image.loading =
                index === 0
                ? "eager"
                : "lazy";


            slide.appendChild(
                image
            );


            track.appendChild(
                slide
            );


            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "dot" +
                (
                    index === 0
                    ? " active"
                    : ""
                );


            dots.appendChild(
                dot
            );

        }
    );


    currentSlide = 0;


    updateSlider();

    startSlider();

}


/* =========================
   UPDATE SLIDER
========================= */

function updateSlider(){

    const track =
        document.getElementById(
            "slidesTrack"
        );


    const dots =
        document.querySelectorAll(
            ".dot"
        );


    track.style.transform =
        "translate3d(-" +
        (
            currentSlide * 100
        ) +
        "%,0,0)";


    dots.forEach(
        (dot,index)=>{

            dot.classList.toggle(
                "active",
                index === currentSlide
            );

        }
    );

}


/* =========================
   AUTO SLIDER
========================= */

function startSlider(){

    clearInterval(
        sliderTimer
    );


    if(
        posters.length <= 1
    ){
        return;
    }


    sliderTimer =
        setInterval(
            ()=>{

                currentSlide++;


                if(
                    currentSlide >=
                    posters.length
                ){

                    currentSlide = 0;

                }


                updateSlider();


            },
            3000
        );

}


/* =========================
   FORM
========================= */

const mobile =
    document.getElementById(
        "mobile"
    );


const password =
    document.getElementById(
        "password"
    );


const continueBtn =
    document.getElementById(
        "continueBtn"
    );


function validate(){

    let number =
        mobile.value.replace(
            /\D/g,
            ""
        );


    number =
        number.substring(
            0,
            10
        );


    mobile.value =
        number;


    const valid =
        number.length === 10 &&
        password.value.length > 0;


    continueBtn.disabled =
        !valid;


    continueBtn.classList.toggle(
        "enabled",
        valid
    );

}


mobile.addEventListener(
    "input",
    validate
);


password.addEventListener(
    "input",
    validate
);


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        showToast.timer
    );


    showToast.timer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            2000
        );

}


/* =========================
   LOGIN
========================= */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();


            if(
                continueBtn.disabled
            ){

                return;

            }


            showToast(
                "Account details accepted."
            );

        }
    );


/* =========================
   FORGOT
========================= */

document
    .getElementById(
        "forgot"
    )
    .addEventListener(
        "click",
        ()=>{

            showToast(
                "Forget Password"
            );

        }
    );


/* =========================
   REGISTER
========================= */

document
    .getElementById(
        "registerBtn"
    )
    .addEventListener(
        "click",
        ()=>{

            showToast(
                "Register New Account"
            );

        }
    );


/* =========================
   TELEGRAM
========================= */

document
    .getElementById(
        "telegram"
    )
    .addEventListener(
        "click",
        function(event){

            event.preventDefault();


            showToast(
                "Telegram"
            );

        }
    );


/* =========================
   START
========================= */

createSlides();

</script>

</body>
</html>
