<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TOP PAY • Success</title>

<link
    rel="icon"
    type="image/webp"
    href="https://i.ibb.co/fVqwvyvF/aa.webp"
>

<link
    rel="apple-touch-icon"
    href="https://i.ibb.co/fVqwvyvF/aa.webp"
>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#f5f7fc;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color:#111;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100%;
    max-width:560px;

    min-height:100vh;

    margin:0 auto;

    position:relative;
}


/* =====================================================
   BLUE HEADER
===================================================== */

.top-header{
    width:100%;
    height:245px;

    background:
        linear-gradient(
            135deg,
            #0878ff 0%,
            #075fe7 48%,
            #164fc8 100%
        );

    border-radius:
        0 0 72px 72px;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:27px;
}


/* =====================================================
   LOGO
===================================================== */

.logo-circle{
    width:104px;
    height:104px;

    border-radius:50%;

    background:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.logo-circle img{
    width:82px;
    height:82px;

    object-fit:contain;

    display:block;
}


/* =====================================================
   BRAND
===================================================== */

.brand-name{
    margin-top:3px;

    color:#fff;

    font-size:34px;
    line-height:40px;

    font-weight:700;

    letter-spacing:-.7px;
}


/* =====================================================
   SUCCESS CARD
===================================================== */

.success-card{
    position:absolute;

    top:218px;
    left:50%;

    transform:translateX(-50%);

    width:calc(100% - 36px);

    max-width:524px;

    /* 40% shorter */
    min-height:210px;

    background:#fff;

    border-radius:28px;

    padding:
        28px 18px 25px;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    box-shadow:
        0 10px 30px rgba(35,65,120,.07);
}


/* =====================================================
   SUCCESS ICON
===================================================== */

.success-icon{
    width:70px;
    height:70px;

    border-radius:50%;

    background:#05c85a;

    display:flex;

    align-items:center;
    justify-content:center;

    margin-bottom:16px;
}


/* CHECK */

.success-icon::before{
    content:"";

    width:24px;
    height:39px;

    border-right:5px solid #34475a;
    border-bottom:5px solid #34475a;

    transform:
        rotate(42deg)
        translate(-2px,-2px);

    border-radius:2px;
}


/* =====================================================
   TITLE
===================================================== */

.success-title{
    margin:0;

    color:#1e314b;

    font-size:25px;
    line-height:31px;

    font-weight:700;

    letter-spacing:-.35px;

    white-space:nowrap;
}


/* =====================================================
   DESCRIPTION
===================================================== */

.success-description{
    margin:
        9px 0 0;

    max-width:440px;

    color:#66758b;

    font-size:15px;
    line-height:21px;

    font-weight:400;
}


/* =====================================================
   REDIRECT
===================================================== */

.redirect-text{
    margin-top:16px;

    color:#2870d1;

    font-size:17px;
    line-height:23px;

    font-weight:700;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:430px){

    .top-header{
        height:245px;

        border-radius:
            0 0 72px 72px;

        padding-top:27px;
    }

    .logo-circle{
        width:104px;
        height:104px;
    }

    .logo-circle img{
        width:82px;
        height:82px;
    }

    .brand-name{
        font-size:34px;
        line-height:40px;
    }

    .success-card{
        top:218px;

        width:calc(100% - 36px);

        min-height:210px;

        border-radius:28px;

        padding:
            28px 15px 25px;
    }

    .success-icon{
        width:70px;
        height:70px;

        margin-bottom:16px;
    }

    .success-title{
        font-size:25px;
        line-height:31px;
    }

    .success-description{
        font-size:15px;
        line-height:21px;
    }

    .redirect-text{
        font-size:17px;
        line-height:23px;

        margin-top:16px;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width:380px){

    .top-header{
        height:225px;

        border-radius:
            0 0 65px 65px;

        padding-top:22px;
    }

    .logo-circle{
        width:92px;
        height:92px;
    }

    .logo-circle img{
        width:72px;
        height:72px;
    }

    .brand-name{
        font-size:30px;
        line-height:36px;
    }

    .success-card{
        top:200px;

        width:calc(100% - 30px);

        min-height:195px;

        border-radius:25px;

        padding:
            23px 12px 21px;
    }

    .success-icon{
        width:62px;
        height:62px;

        margin-bottom:13px;
    }

    .success-icon::before{
        width:21px;
        height:35px;

        border-width:5px;
    }

    .success-title{
        font-size:22px;
        line-height:28px;
    }

    .success-description{
        margin-top:7px;

        font-size:14px;
        line-height:20px;
    }

    .redirect-text{
        margin-top:13px;

        font-size:16px;
        line-height:21px;
    }
}


/* =====================================================
   VERY SMALL
===================================================== */

@media (max-width:340px){

    .success-title{
        font-size:20px;
        line-height:26px;
    }

    .success-description{
        font-size:13px;
        line-height:19px;
    }

    .redirect-text{
        font-size:15px;
        line-height:20px;
    }
}

</style>

</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header class="top-header">

        <div class="logo-circle">

            <img
                src="https://i.ibb.co/fVqwvyvF/aa.webp"
                alt="TOP PAY"
            >

        </div>

        <div class="brand-name">
            TOP PAY
        </div>

    </header>


    <!-- SUCCESS CARD -->

    <main class="success-card">

        <div class="success-icon"></div>


        <h1 class="success-title">
            Wallet Successfully Updated
        </h1>


        <p class="success-description">
            Your transaction has been processed securely
            <br>
            with TOP PAY.
        </p>


        <div
            class="redirect-text"
            id="redirectText">

            Redirecting in 4 seconds...

        </div>

    </main>

</div>


<script>

/* =====================================================
   REDIRECT
===================================================== */

const REDIRECT_URL =
    "https://toppay-azure.vercel.app/";


/* =====================================================
   COUNTDOWN
===================================================== */

let seconds = 4;

const redirectText =
    document.getElementById(
        "redirectText"
    );


const countdown =
    setInterval(
        function(){

            seconds--;

            if(seconds > 0){

                redirectText.textContent =
                    "Redirecting in " +
                    seconds +
                    " seconds...";

            }

            if(seconds <= 0){

                clearInterval(
                    countdown
                );

                redirectText.textContent =
                    "Redirecting...";

                window.location.href =
                    REDIRECT_URL;

            }

        },
        1000
    );

</script>

</body>
</html>
